services:
  web:
    build: .
    container_name: mota-web
    command: sh /app/scripts/entrypoint.sh gunicorn MOTA.wsgi:application --bind 0.0.0.0:8000 --timeout 120
    volumes:
    - /opt/mota/staticfiles:/app/staticfiles
    - /opt/mota/media:/app/media

    ports:
      - "8004:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - mynetwork

  db:
    image: postgres:15
    container_name: mota-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork

  redis:
    image: redis:7
    container_name: mota-redis
    ports:
      - "6379"
    networks:
      - mynetwork

  celery:
    build: .
    container_name: mota-celery
    command: sh /app/scripts/entrypoint.sh celery -A MOTA worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - mynetwork

volumes:
  postgres_data:

networks:
  mynetwork:
    driver: bridge
