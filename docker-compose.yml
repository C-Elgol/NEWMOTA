services:
  web:
    build: .
    container_name: nity-pulse-web
    command: sh /app/scripts/entrypoint.sh gunicorn nitypulse_backend.wsgi:application --bind 0.0.0.0:8000 --timeout 120
    volumes:
    - /opt/nity-pulse/staticfiles:/app/staticfiles
    - /opt/nity-pulse/media:/app/media

    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - mynetwork

  db:
    image: postgres:15
    container_name: nity-pulse-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork

  redis:
    image: redis:7
    container_name: nity-pulse-redis
    ports:
      - "6379"
    networks:
      - mynetwork

  celery:
    build: .
    container_name: nity-pulse-celery
    command: sh /app/scripts/entrypoint.sh celery -A nitypulse_backend worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - mynetwork

volumes:
  postgres_data:

networks:
  mynetwork:
    driver: bridge
