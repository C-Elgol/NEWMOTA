{% load i18n static %}

<header class="bg-white shadow-sm overflow-visible">
  <div class="flex items-center justify-between px-6 py-4">
    <!-- Mobile menu button -->
    <button id="mobile-menu-button" type="button" class="admin-nav-bar:hidden text-gray-500 focus:outline-none">
      <i class="fas fa-bars text-xl"></i>
    </button>

    <!-- Season display -->
    <div class="hidden md:block flex-1 text-sm font-medium text-gray-700">
      {% if season %}
        {% trans "Meeting Season" %}: {{ season }}
      {% else %}
        {% trans "No Season Selected" %}
      {% endif %}
    </div>

    <!-- Right side -->
    <div class="flex items-center space-x-4">
      <button
        id="season-selection-btn"
        class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        onclick="showSeasonModal()">
        {% trans "Seasons" %}
      </button>
      <!-- Notifications -->
      <button type="button"
              class="p-1 rounded-full text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 relative">
        <i class="fas fa-bell text-xl"></i>
        <span class="absolute top-0 right-0 h-2 w-2 rounded-full bg-red-500"></span>
      </button>

      <!-- Messages -->
      <button type="button"
              class="p-1 rounded-full text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 relative">
        <i class="fas fa-envelope text-xl"></i>
        <span class="absolute top-0 right-0 h-2 w-2 rounded-full bg-red-500"></span>
      </button>

      <!-- User dropdown -->
      <div class="relative js-dropdown">
        <button type="button" class="flex items-center space-x-2 focus:outline-none js-dropdown-btn"
                aria-haspopup="menu" aria-expanded="false">
          {% with obj.user.get_profile_picture as profile_picture %}
            {% if profile_picture %}
              <img class="w-8 h-8 rounded-full" src="{{ profile_picture }}"
                   alt="{% trans 'Profile Picture' %}">
            {% else %}
              <svg class="w-8 h-8 text-gray-400" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                   viewBox="0 0 24 24">
                <path fill-rule="evenodd"
                      d="M12 20a7.966 7.966 0 0 1-5.002-1.756l.002.001v-.683c0-1.794 1.492-3.25 3.333-3.25h3.334c1.84 0 3.333 1.456 3.333 3.25v.683A7.966 7.966 0 0 1 12 20ZM2 12C2 6.477 6.477 2 12 2s10 4.477 10 10c0 5.5-4.44 9.963-9.932 10h-.138C6.438 21.962 2 17.5 2 12Zm10-5c-1.84 0-3.333 1.455-3.333 3.25S10.159 13.5 12 13.5c1.84 0 3.333-1.455 3.333-3.25S13.841 7 12 7Z"
                      clip-rule="evenodd"></path>
              </svg>
            {% endif %}
          {% endwith %}
          <span class="hidden md:block text-sm font-medium text-gray-700"></span>
          <i class="fas fa-chevron-down text-xs"></i>
        </button>

        <!-- Dropdown menu -->
        <div class="js-dropdown-menu hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
          <div class="px-4 py-2 text-sm text-gray-700">
            <span class="font-medium"></span>
          </div>
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            <i class="fas fa-user mr-2"></i> {% trans "Profile" %}
          </a>
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            <i class="fas fa-home mr-2"></i> {% trans "Home" %}
          </a>
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            <i class="fas fa-envelope mr-2"></i> {% trans "Messages" %}
          </a>
          <a href="{% url 'users:logout' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
            <i class="fas fa-sign-out-alt mr-2"></i> {% trans "Sign out" %}
          </a>
        </div>
      </div>

      <!-- Language Switcher -->
      <form method="post" action="{% url 'set_language' %}" class="inline" id="language-form">
        {% csrf_token %}
        <select name="language" class="bg-white border-none text-gray-700 focus:ring-0 pl-1 pr-6 py-0.5" title="{% trans 'Select Language' %}" id="language-select">
          {% get_available_languages as LANGUAGES %}
          {% for lang in LANGUAGES %}
            <option value="{{ lang.0 }}" {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>
              {{ lang.1 }} {% if lang.0 == 'en' %}🇬🇧{% elif lang.0 == 'fr' %}🇫🇷{% endif %}
            </option>
          {% endfor %}
        </select>
      </form>
    </div>
  </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const languageSelect = document.getElementById('language-select');
    const languageForm = document.getElementById('language-form');
    
    if (languageSelect && languageForm) {
      languageSelect.addEventListener('change', function() {
        languageForm.submit();
      });
    }

    // Dropdown handling
    const dropdowns = document.querySelectorAll('.js-dropdown');
    dropdowns.forEach(function(dd) {
      const btn = dd.querySelector('.js-dropdown-btn');
      const menu = dd.querySelector('.js-dropdown-menu');
      if (!btn || !menu) return;

      const open = () => {
        menu.classList.remove('hidden');
        btn.setAttribute('aria-expanded', 'true');
      };

      const close = () => {
        menu.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      };

      const toggle = () => {
        if (menu.classList.contains('hidden')) open(); else close();
      };

      btn.addEventListener('click', function(e) {
        e.preventDefault();
        toggle();
      });

      document.addEventListener('click', function(e) {
        if (!dd.contains(e.target)) close();
      });

      dd.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') close();
      });
    });

    // Mobile menu
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const sidebar = document.querySelector('.admin-nav-bar');
    if (mobileMenuButton && sidebar) {
      mobileMenuButton.addEventListener('click', function() {
        sidebar.classList.toggle('hidden');
      });
    }

    // Season selection modal toggle
    window.showSeasonModal = function() {
        const seasonModal = document.getElementById('season-selection-modal');
        if (seasonModal) {
            seasonModal.classList.remove('hidden');
        } else {
            // Fallback: Navigate to season selection page
            window.location.href = '{% url 'finance:season_selection' %}';
        }
    };

    // Close modal on click outside or Escape key
    const seasonModal = document.getElementById('season-selection-modal');
    if (seasonModal) {
        seasonModal.addEventListener('click', function(e) {
            if (e.target === seasonModal) {
                seasonModal.classList.add('hidden');
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !seasonModal.classList.contains('hidden')) {
                seasonModal.classList.add('hidden');
            }
        });
    }
});
</script>
