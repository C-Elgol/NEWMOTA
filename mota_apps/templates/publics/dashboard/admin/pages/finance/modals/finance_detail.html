{% load i18n %}

<div id="detail-modal" class="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-[1000] hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 transform scale-95 transition-transform duration-300">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">{% trans "Finance Record Details" %}</h2>
            <button id="close-detail-btn" class="text-gray-500 hover:text-gray-700">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">{% trans "Member" %}</label>
                <p id="detail-member" class="mt-1 text-sm text-gray-900"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% trans "Entertainment Fees" %}</label>
                <p id="detail-entertainment" class="mt-1 text-sm text-gray-900"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% trans "Savings" %}</label>
                <p id="detail-savings" class="mt-1 text-sm text-gray-900"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% trans "Njangi" %}</label>
                <p id="detail-njangi" class="mt-1 text-sm text-gray-900"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% trans "Project" %}</label>
                <p id="detail-project" class="mt-1 text-sm text-gray-900"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% trans "Others" %}</label>
                <p id="detail-others" class="mt-1 text-sm text-gray-900"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% trans "Total" %}</label>
                <p id="detail-total" class="mt-1 text-sm text-gray-900"></p>
            </div>
        </div>
        <div class="mt-6 flex justify-end">
            <button id="close-detail-btn-bottom" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600">{% trans "Close" %}</button>
        </div>
    </div>
</div>
