{% load i18n %}

<div id="delete-modal" class="modal fixed inset-0 bg-gray-900/50 flex items-center justify-center z-[1000] hidden opacity-0 transition-opacity duration-300">
    <div class="modal-content bg-white rounded-lg shadow-lg max-w-md w-full p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">{% trans "Confirm Deletion" %}</h2>
        <p class="text-sm text-gray-600 mb-6">
            {% blocktrans %}Are you sure you want to delete the finance record for <span id="delete-name"></span>?{% endblocktrans %}
        </p>
        <div class="flex justify-end gap-4">
            <button id="cancel-delete-btn" class="close-btn bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600">{% trans "Cancel" %}</button>
            <button id="confirm-delete-btn" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">{% trans "Delete" %}</button>
        </div>
    </div>
</div>
