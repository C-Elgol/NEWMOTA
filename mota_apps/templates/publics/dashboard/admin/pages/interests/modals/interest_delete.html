{% load i18n %}

<div id="delete-modal" class="modal fixed inset-0 bg-gray-900/50 flex items-center justify-center z-[10000002] hidden opacity-0 transition-opacity duration-300">
    <div class="modal-content bg-white rounded-lg shadow-lg max-w-md w-full p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">{% trans "Confirm Delete" %}</h2>
            <button class="close-btn text-gray-500 hover:text-gray-700">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <p class="text-sm text-gray-600 mb-4">
            {% blocktrans %}
            Are you sure you want to delete the interest record for <span id="delete-name" class="font-medium"></span>?
            This action cannot be undone.
            {% endblocktrans %}
        </p>
        <div class="flex justify-end space-x-2">
            <button class="close-btn bg-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-400">
                {% trans "Cancel" %}
            </button>
            <button id="confirm-delete-btn" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">
                {% trans "Delete" %}
            </button>
        </div>
    </div>
</div>
