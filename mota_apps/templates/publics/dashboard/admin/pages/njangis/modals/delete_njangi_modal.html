
{% load static %}
{% load i18n %}
<div id="deleteModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">{% trans "Confirm Deletion" %}</h3>
        <p class="text-gray-600 mb-6">{% trans "Are you sure you want to delete this njangi beneficiary?" %}</p>
        <div class="flex justify-end space-x-3">
            <button onclick="closeDeleteModal()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-400">{% trans "Cancel" %}</button>
            <button onclick="confirmDelete()" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">{% trans "Delete" %}</button>
        </div>
    </div>
</div>
