{% load i18n %}
<div id="detail-modal" class="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-[10000002] hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 modal-content transform scale-95 transition-transform duration-300">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-800">{% trans "Project Record Details" %}</h3>
            <button class="close-btn text-gray-500 hover:text-gray-700">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <p class="text-sm font-medium text-gray-700">{% trans "Date Collected" %}</p>
                <p id="detail-date-collected" class="text-base text-gray-900"></p>
            </div>
            <div>
                <p class="text-sm font-medium text-gray-700">{% trans "Amount Collected" %}</p>
                <p id="detail-amount-collected" class="text-base text-gray-900"></p>
            </div>
            <div>
                <p class="text-sm font-medium text-gray-700">{% trans "Interest Collected" %}</p>
                <p id="detail-interest-collected" class="text-base text-gray-900"></p>
            </div>
            <div>
                <p class="text-sm font-medium text-gray-700">{% trans "Comment" %}</p>
                <p id="detail-comment" class="text-base text-gray-900"></p>
            </div>
            <div>
                <p class="text-sm font-medium text-gray-700">{% trans "Recorded By" %}</p>
                <p id="detail-recorded-by" class="text-base text-gray-900"></p>
            </div>
            <div>
                <p class="text-sm font-medium text-gray-700">{% trans "Signature" %}</p>
                <img id="detail-signature" class="border border-gray-300 w-full max-w-xs h-auto hidden" alt="{% trans 'Signature' %}" />
            </div>
            <div>
                <p class="text-sm font-medium text-gray-700">{% trans "Uploaded File" %}</p>
                <a id="detail-file-link" href="#" target="_blank" class="text-blue-600 hover:underline hidden">{% trans "View PDF" %}</a>
                <img id="detail-file-img" class="border border-gray-300 w-full max-w-xs h-auto hidden" alt="{% trans 'Uploaded Image' %}" />
            </div>
        </div>
        <div class="mt-6 flex justify-end">
            <button class="close-btn bg-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-400">{% trans "Close" %}</button>
        </div>
    </div>
</div>
